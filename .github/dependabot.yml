# Dependabot configuration
# Cooldown delays updating normal npm dependencies by 7 days but allows security updates to be processed immediately.
# Note: Cooldown is not supported for the github-actions ecosystem.
# Reference: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2
updates:

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'cron'
      timezone: 'Europe/Berlin'
      cronjob: '17 3 19 * *'
    open-pull-requests-limit: 15
    assignees:
      - 'ssbingo'
    versioning-strategy: 'increase'
    cooldown:
      default-days: 7
    ignore:
      # @types/node follows the minimum supported Node.js version (22)
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      # @typescript-eslint@8 caps typescript < 6.1.0
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'cron'
      timezone: 'Europe/Berlin'
      cronjob: '43 5 26 * *'
    open-pull-requests-limit: 15
    assignees:
      - 'ssbingo'
    cooldown:
      default-days: 7
